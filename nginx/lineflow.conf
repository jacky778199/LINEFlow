# ============================================================
# nginx reverse proxy for LineFlow
# Handles TLS termination + HTTP→HTTPS redirect + WSS upgrade
# ============================================================

# HTTP → HTTPS redirect (Let's Encrypt ACME challenge must pass through)
server {
    listen 80;
    server_name YOUR_DOMAIN.com;  # <-- 改成你的 domain

    # Let's Encrypt ACME challenge (certbot webroot mode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + WSS endpoint
server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN.com;  # <-- 改成你的 domain

    # ── TLS 憑證 (由 certbot 自動填入) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN.com/chain.pem;

    # ── 現代 TLS 設定 ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # ── WebSocket 反向代理 ─────────────────────────────────────
    location /ws/ {
        proxy_pass http://lineflow_server:8000;  # Docker 內部 hostname

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 轉發真實 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 長連線 timeout (0 = 不超時)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 連線數限制 (防 DoS)
        limit_conn addr 10;
    }

    # ── Health check (可選，供監控使用) ───────────────────────
    location /health {
        proxy_pass http://lineflow_server:8000;
        proxy_set_header Host $host;
        # 僅允許內部或監控 IP 訪問（按需調整）
        # allow 127.0.0.1;
        # deny all;
    }

    # 其他路徑一律 404
    location / {
        return 404;
    }
}

# 限制每個 IP 的並發 WebSocket 連線數
limit_conn_zone $binary_remote_addr zone=addr:10m;
