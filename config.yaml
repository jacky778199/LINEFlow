server:
  host: "0.0.0.0"
  port: 8000
  # auth_token is NOT set here — use LINEFLOW_AUTH_TOKEN environment variable instead

database:
  path: "data/lineflow.db"

instances:
  instance1:
    enabled: true
    adb_serial: "redroid_line1:5555" # 本地獨立運行時可用 "localhost:5555"
    line_package: "jp.naver.line.android"
    poll_interval_sec: 2.0
    health_check_sec: 30.0
